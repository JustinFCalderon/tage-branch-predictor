<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#5a6070"/></marker>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#a8431f"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="#fdfcfa"/>

  <g>
    <rect x="10" y="30" width="100" height="32" rx="5" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="60" y="50" text-anchor="middle" fill="#1d4e6b" font-weight="700">PC</text>
    <rect x="10" y="76" width="100" height="38" rx="5" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="60" y="93" text-anchor="middle" fill="#1d4e6b" font-weight="700">global history</text>
    <text x="60" y="106" text-anchor="middle" fill="#5a6070" font-size="10">conditional only</text>

    <rect x="132" y="24" width="136" height="42" rx="5" fill="#fff" stroke="#1d4e6b"/>
    <text x="200" y="41" text-anchor="middle" fill="#1d4e6b" font-size="10">fold_pc_index()</text>
    <text x="200" y="55" text-anchor="middle" fill="#5a6070" font-size="10">^p&gt;&gt;10 ^p&gt;&gt;20</text>
    <rect x="132" y="76" width="136" height="42" rx="5" fill="#fff" stroke="#1d4e6b"/>
    <text x="200" y="93" text-anchor="middle" fill="#1d4e6b" font-size="10">fold_pc_tag()</text>
    <text x="200" y="107" text-anchor="middle" fill="#5a6070" font-size="10">^p&gt;&gt;7 ^p&gt;&gt;17</text>

    <rect x="132" y="132" width="136" height="62" rx="5" fill="#f5ead0" stroke="#b8860b"/>
    <text x="200" y="149" text-anchor="middle" fill="#7a5a08" font-weight="700" font-size="10">folded history</text>
    <text x="200" y="163" text-anchor="middle" fill="#7a5a08" font-size="10">idx10 tagA10</text>
    <text x="200" y="176" text-anchor="middle" fill="#7a5a08" font-size="10">tagB9 tagC8</text>
    <text x="200" y="189" text-anchor="middle" fill="#5a6070" font-size="10">per table &#183; O(1)</text>

    <line x1="110" y1="46" x2="130" y2="46" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="110" y1="56" x2="126" y2="92" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="110" y1="102" x2="128" y2="152" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="268" y1="45" x2="296" y2="60" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="268" y1="97" x2="296" y2="86" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="268" y1="160" x2="296" y2="110" stroke="#5a6070" marker-end="url(#ar)"/>
    <text x="282" y="132" text-anchor="middle" fill="#5a6070" font-size="10">XOR</text>
  </g>

  <g>
    <text x="420" y="12" text-anchor="middle" fill="#5a6070" font-size="10">probe all in parallel</text>
    <rect x="300" y="18" width="240" height="212" rx="6" fill="#fbfaf7" stroke="#c9c3b8" stroke-dasharray="3 3"/>
    <rect x="310" y="28" width="220" height="21" rx="3" fill="#efece6" stroke="#a09a8e"/>
    <text x="318" y="42" fill="#5a6070" font-size="10">T0 bimodal &#183; 2048 &#183; no tag</text>
    <rect x="310" y="56" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="68" fill="#1d4e6b" font-size="10">T1 &#183; L=5</text>
    <text x="522" y="68" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="75" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="87" fill="#1d4e6b" font-size="10">T2 &#183; L=10</text>
    <text x="522" y="87" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="94" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="106" fill="#1d4e6b" font-size="10">T3 &#183; L=20</text>
    <text x="522" y="106" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="113" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="125" fill="#1d4e6b" font-size="10">T4 &#183; L=40</text>
    <text x="522" y="125" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="132" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="144" fill="#1d4e6b" font-size="10">T5 &#183; L=80</text>
    <text x="522" y="144" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="151" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="163" fill="#1d4e6b" font-size="10">T6 &#183; L=160</text>
    <text x="522" y="163" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="170" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="182" fill="#1d4e6b" font-size="10">T7 &#183; L=320</text>
    <text x="522" y="182" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
    <rect x="310" y="189" width="220" height="17" rx="3" fill="#e3ebf1" stroke="#1d4e6b"/>
    <text x="318" y="201" fill="#1d4e6b" font-size="10">T8 &#183; L=640</text>
    <text x="522" y="201" text-anchor="end" fill="#5a6070" font-size="10">1024 &#215; 15 b</text>
  </g>

  <g>
    <rect x="572" y="40" width="140" height="46" rx="5" fill="#fff" stroke="#1d4e6b"/>
    <text x="642" y="59" text-anchor="middle" fill="#1d4e6b" font-weight="700" font-size="10">tag compare</text>
    <text x="642" y="74" text-anchor="middle" fill="#5a6070" font-size="10">which tables answer</text>

    <rect x="572" y="104" width="140" height="66" rx="5" fill="#d9eae5" stroke="#0f6e5a"/>
    <text x="642" y="122" text-anchor="middle" fill="#0f6e5a" font-weight="700" font-size="10">longest match</text>
    <text x="642" y="136" text-anchor="middle" fill="#0f6e5a" font-size="10">= PROVIDER</text>
    <text x="642" y="150" text-anchor="middle" fill="#b8860b" font-size="10">next = ALTPRED</text>
    <text x="642" y="163" text-anchor="middle" fill="#5a6070" font-size="10">T0 always matches</text>

    <rect x="572" y="188" width="140" height="54" rx="5" fill="#f5ead0" stroke="#b8860b"/>
    <text x="642" y="206" text-anchor="middle" fill="#7a5a08" font-weight="700" font-size="10">use_alt_on_new</text>
    <text x="642" y="220" text-anchor="middle" fill="#5a6070" font-size="10">weak+new provider?</text>
    <text x="642" y="233" text-anchor="middle" fill="#5a6070" font-size="10">4-bit global ctr</text>

    <rect x="742" y="112" width="138" height="50" rx="5" fill="#1d4e6b"/>
    <text x="811" y="133" text-anchor="middle" fill="#fff" font-weight="700" font-size="10">PREDICTION</text>
    <text x="811" y="148" text-anchor="middle" fill="#cfe0ea" font-size="10">taken / not taken</text>

    <line x1="540" y1="90" x2="570" y2="66" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="642" y1="86" x2="642" y2="102" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="642" y1="170" x2="642" y2="186" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="712" y1="137" x2="740" y2="137" stroke="#5a6070" marker-end="url(#ar)"/>
    <line x1="712" y1="215" x2="726" y2="215" stroke="#5a6070"/>
    <line x1="726" y1="215" x2="726" y2="152" stroke="#5a6070" marker-end="url(#ar)"/>
  </g>

  <g>
    <rect x="742" y="196" width="138" height="32" rx="5" fill="#f2dcd3" stroke="#a8431f"/>
    <text x="811" y="216" text-anchor="middle" fill="#a8431f" font-weight="700" font-size="10">actual outcome</text>

    <rect x="490" y="300" width="180" height="58" rx="5" fill="#fff" stroke="#a8431f"/>
    <text x="580" y="318" text-anchor="middle" fill="#a8431f" font-weight="700" font-size="10">update counters</text>
    <text x="580" y="332" text-anchor="middle" fill="#5a6070" font-size="10">provider ctr &#8594; outcome</text>
    <text x="580" y="345" text-anchor="middle" fill="#5a6070" font-size="10">u only if prov &#8800; alt</text>

    <rect x="250" y="300" width="190" height="58" rx="5" fill="#fff" stroke="#a8431f"/>
    <text x="345" y="318" text-anchor="middle" fill="#a8431f" font-weight="700" font-size="10">allocate (on miss)</text>
    <text x="345" y="332" text-anchor="middle" fill="#5a6070" font-size="10">longer table, u==0, nearest</text>
    <text x="345" y="345" text-anchor="middle" fill="#5a6070" font-size="10">else decrement all u</text>

    <rect x="20" y="300" width="180" height="58" rx="5" fill="#fff" stroke="#a8431f"/>
    <text x="110" y="318" text-anchor="middle" fill="#a8431f" font-weight="700" font-size="10">push history</text>
    <text x="110" y="332" text-anchor="middle" fill="#5a6070" font-size="10">all folds advance</text>
    <text x="110" y="345" text-anchor="middle" fill="#5a6070" font-size="10">rotl ^ in ^ out</text>

    <line x1="811" y1="228" x2="811" y2="329" stroke="#a8431f"/>
    <line x1="811" y1="329" x2="672" y2="329" stroke="#a8431f" marker-end="url(#arw)"/>
    <line x1="490" y1="329" x2="442" y2="329" stroke="#a8431f" marker-end="url(#arw)"/>
    <line x1="250" y1="329" x2="202" y2="329" stroke="#a8431f" marker-end="url(#arw)"/>
    <line x1="345" y1="300" x2="345" y2="234" stroke="#a8431f" marker-end="url(#arw)"/>
    <line x1="110" y1="300" x2="110" y2="118" stroke="#a8431f" marker-end="url(#arw)"/>
    <text x="352" y="272" fill="#a8431f" font-size="10">writes tables</text>
    <text x="117" y="272" fill="#a8431f" font-size="10">next branch</text>
  </g>

  <text x="14" y="392" fill="#5a6070" font-size="10">teal = predict path &#183; sienna = update path &#183; amber = the two learned policies</text>
  <text x="14" y="410" fill="#5a6070" font-size="10">15.50 KiB of modelled state; the whole predict path is one cycle in hardware</text>
  <text x="14" y="430" fill="#a8431f" font-size="10">the 2025 defect lived in fold_pc_tag + the tag XOR &#8212; two boxes, invisible in the output</text>
</svg>